name: Resolve Cloudflare IPs

on:
  workflow_dispatch:          # 由第三方 cron 触发

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install dnspython pyyaml

      - name: Run resolution
        run: python resolve_ip.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add ips-*.txt ips-all.txt
          git diff --staged --quiet || git commit -m "update ips $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

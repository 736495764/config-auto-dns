# ==================== 全局配置 ====================
# 全部结果文件的完整名称（可自定义后缀）
all_output: "ips-all.txt"

# ==================== 通道配置 ====================
routes:
  - name: qms_ct                          # 通道名称（用于 all 文件的 #备注）
    enable: true                          # 通道开关 true=开启 false=关闭
    domain: ct.877774.xyz
    dns: 8.8.8.8
    ecs: 14.153.0.0/24
    count: 2                              # 单通道结果文件最多输出几个IP
    output: "ips-qms_ct.txt"              # 单通道结果文件完整名称（可自定义后缀）
    fallback: "172.64.229.44#172.64.229.44@替补"   # 失败时写入的替补内容（原样写入）

  - name: qms_na
    enable: true
    domain: na.877774.xyz
    dns: 8.8.8.8
    ecs: 14.153.0.0/24
    count: 2
    output: "ips-qms_na.list"
    fallback: "104.19.74.233#104.19.74.233@替补"

  # 继续添加更多通道即可
  # - name: another
  #   enable: false
  #   domain: example.com
  #   dns: 8.8.8.8
  #   ecs: 14.153.0.0/24
  #   count: 2
  #   output: "ips-another.txt"
  #   fallback: "example.com#example.com@0921·0000"
